steps:
- name: gcr.io/cloud-builders/docker
  args: ['build','-t','$_IMAGE','.']
- name: gcr.io/cloud-builders/docker
  args: ['push','$_IMAGE']
- name: gcr.io/google.com/cloudsdktool/cloud-sdk
  entrypoint: gcloud
  args: ['run','deploy','$_SERVICE','--image','$_IMAGE','--region','$_REGION','--platform','managed','--allow-unauthenticated','--memory','512Mi','--cpu','1','--min','0','--max','2','--set-env-vars','CLOUD_RUN_REGION=$_REGION,GOOGLE_CLOUD_PROJECT=$PROJECT_ID']
images: ['$_IMAGE']
substitutions:
  _SERVICE: student-task-manager
  _REGION: asia-south1
  _IMAGE: asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/student-task-manager:$BUILD_ID
options:
  logging: CLOUD_LOGGING_ONLY
